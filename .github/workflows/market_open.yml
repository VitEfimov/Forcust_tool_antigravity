name: Market Open Snapshot

on:
  schedule:
    # 10:00 AM EST is 15:00 UTC (Standard Time)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  market_overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run Market Overview
        env:
          DATABASE_URL: ${{ secrets.MONGO_URI }}
          STORAGE_TYPE: mongo
          PYTHONPATH: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: MONGO_URI secret is missing. Skipping execution."
            exit 1
          fi
          python src/jobs/market_overview_job.py
