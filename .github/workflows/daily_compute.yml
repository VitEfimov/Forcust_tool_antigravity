name: Daily Heavy Compute

on:
  schedule:
    # 4:00 PM EST is 21:00 UTC (Standard Time) or 20:00 UTC (Daylight)
    # Let's set it to 21:00 UTC (Approx 4pm EST)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  daily_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run Daily Automation
        env:
          DATABASE_URL: ${{ secrets.MONGO_URI }}
          STORAGE_TYPE: mongo
          PYTHONPATH: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: MONGO_URI secret is missing. Skipping execution."
            exit 1
          fi
          python src/jobs/daily_run.py
