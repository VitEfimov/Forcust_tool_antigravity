name: Market Overview

on:
  schedule:
    - cron: "0 14 * * 1-5" # 10:00 AM EST (approx)
    - cron: "15 20 * * 1-5" # 16:15 PM EST (approx)
  workflow_dispatch:

jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Wake Render Server
        run: |
          curl --fail ${{ secrets.RENDER_BACKEND_URL }}/system/status || echo "Wakeup ping failed"

      - name: Run Market Overview
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENV: "production"
          EXECUTION_SOURCE: "github_actions"
        run: |
          python src/jobs/market_overview_job.py
