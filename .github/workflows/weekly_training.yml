name: Weekly Training

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0" # Sunday 6:00 UTC (1:00 AM EST)

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # env:
    #   ALLOW_WEEKLY_TRAINING: ${{ secrets.ALLOW_WEEKLY_TRAINING }}

    # Safety: Only run if explicitly enabled in secrets AND it's a scheduled run or intentional dispatch
    if: ${{ secrets.ALLOW_WEEKLY_TRAINING == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Wake Render Server
        run: |
          curl --fail ${{ secrets.RENDER_BACKEND_URL }}/system/status || echo "Wakeup ping failed"

      - name: Run Weekly Training
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ALLOW_WEEKLY_TRAINING: ${{ secrets.ALLOW_WEEKLY_TRAINING }}
          FORCE_TRAINING: "true"
          ENV: "production"
          EXECUTION_SOURCE: "github_actions"
        run: |
          python src/jobs/weekly_train.py
