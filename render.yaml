services:
  # 1. Web Service (API + In-Process Scheduler)
  - type: web
    name: forecasting-api
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        value: sqlite:///./data/forecasts.db
      - key: DATA_CACHE_DIR
        value: ./data
      - key: LOCAL_DATA_DIR
        value: ./data

